name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private job, client, tenant, employee, or supplier data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest synthetic example that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Jobsite version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all private and identifying information.
          required: true
