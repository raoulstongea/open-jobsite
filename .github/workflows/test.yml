name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest
      - name: Run five-case synthetic benchmark
        run: uv run python benchmark/run_benchmarks.py
      - name: Preflight STDIO demo
        run: uv run python demo/run_demo.py
